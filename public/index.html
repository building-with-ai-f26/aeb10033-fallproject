<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrapbook Kitchen</title>
  <!-- Fonts: Caveat (handwritten headings) + Nunito (body). Falls back to system fonts if offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f7f0e3;
      --card: #fffdf8;
      --ink: #3a2e28;
      --muted: #7a6a5f;
      --line: #eadfce;
      --tomato: #e0523a;
      --tomato-dark: #b73d28;
      --butter: #ffeaa6;
      --mint: #cdeedb;
      --pink: #ffd7de;
      --sky: #d7e8fb;
      --sage: #e4edd4;
      --hand: "Caveat", "Bradley Hand", "Segoe Print", cursive;
      --body: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      font-family: var(--body);
      color: var(--ink);
      line-height: 1.55;
      background-color: var(--paper);
      background-image: radial-gradient(#e4d6bf 1px, transparent 1px); /* dotted journal paper */
      background-size: 22px 22px;
    }
    .container { max-width: 760px; margin: 0 auto; padding: 28px 16px 80px; }

    /* ---------- Header ---------- */
    header { text-align: center; margin-bottom: 8px; }
    .logo { font-size: 46px; line-height: 1; }
    h1 {
      font-family: var(--hand);
      font-size: clamp(48px, 10vw, 68px);
      line-height: 1;
      margin: 6px 0 6px;
      color: var(--tomato);
      text-shadow: 2px 2px 0 #fff;
    }
    .tagline { margin: 0 auto; max-width: 480px; color: var(--muted); font-weight: 600; }

    /* ---------- Paper cards with washi tape ---------- */
    section.card {
      position: relative;
      background: var(--card);
      border-radius: 6px;
      padding: 30px 22px 24px;
      margin: 40px 0;
      box-shadow: 0 2px 0 var(--line), 0 12px 28px rgba(90, 60, 30, 0.10);
      transform: rotate(-0.4deg);
    }
    section.card:nth-of-type(even) { transform: rotate(0.35deg); }
    section.card::before {
      content: "";
      position: absolute;
      top: -13px;
      left: 50%;
      width: 120px;
      height: 28px;
      transform: translateX(-50%) rotate(-3deg);
      background-color: var(--tape);
      background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.35) 0 6px, transparent 6px 12px);
      border-radius: 2px;
      opacity: 0.9;
    }
    #add    { --tape: #f5a99a; }
    #review { --tape: #9fd9bb; }
    #saved  { --tape: #a9c8f0; }

    h2 {
      font-family: var(--hand);
      font-size: 36px;
      line-height: 1.1;
      margin: 0 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      flex: none;
      border-radius: 50%;
      background: var(--tomato);
      color: #fff;
      font-family: var(--body);
      font-size: 17px;
      font-weight: 800;
      transform: rotate(-8deg);
    }

    /* ---------- Form controls ---------- */
    label { display: block; font-weight: 700; font-size: 14px; margin: 14px 0 5px; }
    .hint { font-weight: 400; color: var(--muted); }
    input[type=text], input[type=url], input[type=search], textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      font: inherit;
      color: inherit;
      background: #fff;
    }
    input:focus, textarea:focus, select:focus { outline: 3px solid #f6b9ad; border-color: var(--tomato); }
    textarea { min-height: 90px; resize: vertical; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > * { flex: 1 1 200px; }

    .visually-hidden {
      position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
    }
    .dropzone {
      display: block;
      margin: 4px 0 0;
      padding: 26px 16px;
      text-align: center;
      border: 2.5px dashed #dcb898;
      border-radius: 16px;
      background: #fffaf0;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s, transform 0.15s;
    }
    .dropzone:hover, .dropzone.dragging { background: var(--butter); transform: scale(1.01); }
    .dropzone:focus-within { outline: 3px solid #f6b9ad; }
    .dropzone .big { display: block; font-size: 36px; margin-bottom: 4px; }
    .dropzone .small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }

    .btn {
      display: inline-block;
      margin: 18px 8px 0 0;
      padding: 12px 22px;
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      color: #fff;
      background: var(--tomato);
      box-shadow: 0 4px 0 var(--tomato-dark);
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .btn:hover { filter: brightness(1.05); }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tomato-dark); }
    .btn.secondary { background: #fff; color: var(--ink); box-shadow: 0 4px 0 var(--line); border: 1.5px solid var(--line); }
    .btn:disabled { opacity: 0.6; cursor: wait; }

    /* ---------- Polaroid thumbnails ---------- */
    .thumbs { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; }
    .thumbs img {
      height: 120px;
      max-width: 100%;
      background: #fff;
      padding: 6px 6px 20px;
      border-radius: 3px;
      box-shadow: 0 4px 12px rgba(60, 40, 20, 0.18);
      transform: rotate(-2deg);
    }
    .thumbs img:nth-child(even) { transform: rotate(2.5deg); }
    .thumbs a { display: inline-block; }

    /* ---------- Status messages ---------- */
    .status-msg { margin-top: 14px; color: var(--muted); font-size: 14px; font-weight: 600; }
    .error { color: #b42318; }
    .loading { display: inline-flex; align-items: center; gap: 8px; }
    .loading .spin { display: inline-block; font-size: 20px; animation: stir 0.9s ease-in-out infinite; }
    @keyframes stir { 0%, 100% { transform: rotate(-20deg); } 50% { transform: rotate(20deg); } }

    /* ---------- Sticky note for "check these" ---------- */
    .sticky {
      background: var(--butter);
      padding: 14px 18px 12px;
      margin: 4px 0 18px;
      border-radius: 2px 2px 14px 2px;
      box-shadow: 0 6px 14px rgba(120, 90, 20, 0.15);
      transform: rotate(-0.8deg);
    }
    .sticky strong { font-family: var(--hand); font-size: 26px; font-weight: 700; }
    .sticky ul { margin: 4px 0 0; padding-left: 20px; }

    .radio-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
    .radio-row label { margin: 0; font-weight: 700; }
    .radio-row input { position: absolute; opacity: 0; }
    .radio-row span {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      background: #fff;
      cursor: pointer;
    }
    .radio-row input:checked + span.want { background: var(--mint); border-color: #8fcfab; }
    .radio-row input:checked + span.fav  { background: var(--pink); border-color: #f0a3b1; }
    .radio-row input:focus-visible + span { outline: 3px solid #f6b9ad; }

    /* ---------- Recipe index cards ---------- */
    .count { color: var(--muted); font-size: 13px; font-weight: 600; margin: 12px 0 0; }
    details.recipe {
      margin: 16px 0;
      padding: 12px 18px 14px 54px;
      border-radius: 8px;
      background-color: #fffef9;
      /* red margin line + blue ruled lines, like an index card */
      background-image:
        linear-gradient(90deg, transparent 38px, #f2b3ab 38px, #f2b3ab 40px, transparent 40px),
        repeating-linear-gradient(#fffef9 0 27px, #dfe9f5 27px 28px);
      box-shadow: 0 3px 10px rgba(60, 40, 20, 0.10);
      border: 1px solid #efe6d8;
    }
    details.recipe summary { cursor: pointer; list-style: none; position: relative; padding-right: 28px; }
    details.recipe summary::-webkit-details-marker { display: none; }
    details.recipe summary::after {
      content: "+";
      position: absolute;
      right: 0;
      top: 2px;
      font-size: 24px;
      font-weight: 800;
      color: var(--tomato);
    }
    details.recipe[open] summary::after { content: "–"; }
    .recipe-title { font-family: var(--hand); font-size: 30px; font-weight: 700; line-height: 1.15; }
    .meta { color: var(--muted); font-size: 14px; font-weight: 600; }
    .meta a { color: var(--tomato-dark); }
    .badge {
      display: inline-block;
      vertical-align: middle;
      font-family: var(--body);
      font-size: 12px;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 999px;
      margin-left: 6px;
    }
    .badge.favorite { background: var(--pink); }
    .badge.want_to_try { background: var(--mint); }
    .tags { margin-top: 6px; }
    .tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 999px;
      margin: 2px 4px 2px 0;
      background: var(--sky);
    }
    .tag:nth-child(4n+2) { background: var(--sage); }
    .tag:nth-child(4n+3) { background: var(--pink); }
    .tag:nth-child(4n+4) { background: var(--butter); }
    .recipe h4 { font-family: var(--hand); font-size: 24px; margin: 16px 0 2px; }
    .recipe ul, .recipe ol { margin: 4px 0 8px; padding-left: 22px; }
    .group-name { font-weight: 800; margin-top: 6px; }
    .empty { text-align: center; padding: 22px 8px 6px; color: var(--muted); font-weight: 600; }
    .empty .big { display: block; font-size: 40px; }

    /* ---------- "Saved!" pop-up ---------- */
    #toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 140%);
      background: var(--ink);
      color: #fff;
      padding: 10px 22px;
      border-radius: 999px;
      font-family: var(--hand);
      font-size: 26px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease;
      z-index: 10;
    }
    #toast.show { transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      section.card, .thumbs img, .sticky { transform: none !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo" aria-hidden="true">🍋📖🍝</div>
      <h1>Scrapbook Kitchen</h1>
      <p class="tagline">Your recipe scrapbook, from screenshots, cookbooks, and everything in between.</p>
    </header>

    <!-- 1. ADD -->
    <section id="add" class="card">
      <h2><span class="step-num">1</span> Add a recipe</h2>

      <label class="dropzone" id="dropzone" for="files">
        <span class="big" aria-hidden="true">📸</span>
        Drop your screenshots here, or click to choose
        <span class="small">Pick all the screenshots for one recipe. They're sorted by file name.</span>
        <input id="files" class="visually-hidden" type="file" accept="image/*" multiple />
      </label>
      <div id="thumbs" class="thumbs"></div>

      <label for="link">Or paste a recipe link <span class="hint">(a recipe website, not social media)</span></label>
      <input id="link" type="url" placeholder="🔗 https://www.allrecipes.com/recipe/..." />

      <label for="pasted">Or paste recipe text <span class="hint">(if a site won't load from its link, copy the recipe from the page and paste it here)</span></label>
      <textarea id="pasted" placeholder="Paste a caption or recipe here"></textarea>

      <button id="extract-btn" class="btn">✨ Read my recipe</button>
      <div id="extract-status" class="status-msg" aria-live="polite"></div>
    </section>

    <!-- 2. REVIEW (hidden until the AI returns a draft) -->
    <section id="review" class="card" hidden>
      <h2><span class="step-num">2</span> Review &amp; fix</h2>
      <div id="uncertain"></div>

      <label for="f-title">Title</label>
      <input id="f-title" type="text" />

      <div class="row">
        <div>
          <label for="f-source-name">Where it came from</label>
          <input id="f-source-name" type="text" placeholder="Creator, website, cookbook, or person" />
        </div>
        <div>
          <label for="f-source-url">Link to the original <span class="hint">(optional)</span></label>
          <input id="f-source-url" type="url" placeholder="https://..." />
        </div>
      </div>

      <div class="row">
        <div><label for="f-servings">Servings</label><input id="f-servings" type="text" /></div>
        <div><label for="f-time">Total time</label><input id="f-time" type="text" /></div>
      </div>

      <label for="f-ingredients">Ingredients <span class="hint">(one per line; start a line with # for a section, like "# Sauce")</span></label>
      <textarea id="f-ingredients" style="min-height: 200px"></textarea>

      <label for="f-steps">Steps <span class="hint">(one per line)</span></label>
      <textarea id="f-steps" style="min-height: 200px"></textarea>

      <label for="f-tags">Tags <span class="hint">(comma-separated; used for search, like "quick, dinner, chicken")</span></label>
      <input id="f-tags" type="text" />

      <label for="f-notes">Notes</label>
      <textarea id="f-notes" style="min-height: 60px"></textarea>

      <label>Save as</label>
      <div class="radio-row">
        <label><input type="radio" name="status" value="want_to_try" checked /><span class="want">★ Want to try</span></label>
        <label><input type="radio" name="status" value="favorite" /><span class="fav">♥ Favorite</span></label>
      </div>

      <button id="save-btn" class="btn">📌 Save to my scrapbook</button>
      <button id="cancel-btn" class="btn secondary">Discard</button>
      <div id="save-status" class="status-msg"></div>
    </section>

    <!-- 3. SEARCH -->
    <section id="saved" class="card">
      <h2><span class="step-num">3</span> My recipes</h2>
      <div class="row">
        <input id="search" type="search" placeholder='🔍 Search, like "brownie" or "quick dinner"' aria-label="Search recipes" />
        <select id="status-filter" style="flex: 0 1 180px" aria-label="Filter by status">
          <option value="">All recipes</option>
          <option value="want_to_try">★ Want to try</option>
          <option value="favorite">♥ Favorites</option>
        </select>
      </div>
      <div id="results"></div>
    </section>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    let images = []; // resized screenshots for the recipe being added (JPEG data URLs)

    // Escape text before putting it into HTML, so recipe text can't break the page.
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function showToast(message) {
      $("toast").textContent = message;
      $("toast").classList.add("show");
      setTimeout(() => $("toast").classList.remove("show"), 2600);
    }

    // Shrink each screenshot (longest side 2000px) so uploads and AI costs stay small.
    async function resizeToJpeg(file) {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, 2000 / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/jpeg", 0.85);
    }

    // Used by both the file picker and drag-and-drop.
    async function handleFiles(fileList) {
      const files = [...fileList]
        .filter((f) => f.type.startsWith("image/"))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
      $("extract-status").textContent = files.length ? "Preparing images..." : "";
      images = await Promise.all(files.map(resizeToJpeg));
      $("thumbs").innerHTML = images.map((src) => `<img src="${src}" alt="Screenshot preview" />`).join("");
      $("extract-status").textContent = files.length ? `${files.length} screenshot${files.length > 1 ? "s" : ""} ready.` : "";
    }

    $("files").addEventListener("change", (e) => handleFiles(e.target.files));

    // Pressing Enter in the link box reads the recipe.
    $("link").addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("extract-btn").click();
    });

    const dropzone = $("dropzone");
    ["dragenter", "dragover"].forEach((type) => dropzone.addEventListener(type, (e) => {
      e.preventDefault();
      dropzone.classList.add("dragging");
    }));
    ["dragleave", "drop"].forEach((type) => dropzone.addEventListener(type, () => dropzone.classList.remove("dragging")));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      handleFiles(e.dataTransfer.files);
    });

    // Fun messages while the AI works.
    const LOADING_MESSAGES = [
      "Visiting the recipe...",
      "Squinting at the handwriting...",
      "Measuring the flour...",
      "Skipping past the ads...",
      "Untangling the screenshots...",
      "Preheating the oven...",
      "Licking the spoon...",
    ];

    // ---- Step 1 -> 2: ask the server to read the recipe ----
    $("extract-btn").addEventListener("click", async () => {
      const text = $("pasted").value;
      const link = $("link").value.trim();
      if (!images.length && !text.trim() && !link) {
        $("extract-status").innerHTML = '<span class="error">Add screenshots, a recipe link, or some recipe text.</span>';
        return;
      }
      $("extract-btn").disabled = true;
      let i = 0;
      const showLoading = () => {
        $("extract-status").innerHTML =
          `<span class="loading"><span class="spin" aria-hidden="true">🥄</span>${LOADING_MESSAGES[i++ % LOADING_MESSAGES.length]}</span>`;
      };
      showLoading();
      const loadingTimer = setInterval(showLoading, 2200);
      try {
        const res = await fetch("/api/extract", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ images, text, link }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        fillReview(data.recipe);
        const u = data.usage;
        $("extract-status").textContent =
          `Done! Cost: $${u.cost_usd != null ? u.cost_usd.toFixed(4) : "unknown"} (${u.input_tokens} in / ${u.output_tokens} out tokens, ${u.model})`;
      } catch (err) {
        $("extract-status").innerHTML = `<span class="error">${esc(err.message)}</span>`;
      } finally {
        clearInterval(loadingTimer);
        $("extract-btn").disabled = false;
      }
    });

    function fillReview(r) {
      $("f-title").value = r.title;
      $("f-source-name").value = r.source_name;
      $("f-source-url").value = r.source_url;
      $("f-servings").value = r.servings;
      $("f-time").value = r.total_time;
      $("f-ingredients").value = r.ingredient_groups
        .map((g) => (g.name ? `# ${g.name}\n` : "") + g.items.join("\n"))
        .join("\n\n");
      $("f-steps").value = r.steps.join("\n");
      $("f-tags").value = r.tags.join(", ");
      $("f-notes").value = r.notes;

      const warnings = [...r.uncertain];
      if (!r.is_recipe) warnings.unshift("The AI doesn't think this is a recipe.");
      $("uncertain").innerHTML = warnings.length
        ? `<div class="sticky"><strong>📌 Double-check these</strong><ul>${warnings.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></div>`
        : "";
      $("save-status").textContent = "";
      $("review").hidden = false;
      $("review").scrollIntoView({ behavior: "smooth" });
    }

    // Turn the ingredients box back into groups: "# Name" starts a new section.
    function parseIngredients(text) {
      const groups = [{ name: "", items: [] }];
      for (const line of text.split("\n").map((l) => l.trim()).filter(Boolean)) {
        if (line.startsWith("#")) groups.push({ name: line.replace(/^#+\s*/, ""), items: [] });
        else groups[groups.length - 1].items.push(line);
      }
      return groups.filter((g) => g.items.length);
    }

    // ---- Step 2: save the reviewed recipe ----
    $("save-btn").addEventListener("click", async () => {
      const recipe = {
        title: $("f-title").value,
        source_name: $("f-source-name").value,
        source_url: $("f-source-url").value,
        servings: $("f-servings").value,
        total_time: $("f-time").value,
        ingredient_groups: parseIngredients($("f-ingredients").value),
        steps: $("f-steps").value.split("\n"),
        tags: $("f-tags").value.split(","),
        notes: $("f-notes").value,
        status: document.querySelector('input[name="status"]:checked').value,
      };
      $("save-btn").disabled = true;
      try {
        const res = await fetch("/api/recipes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ recipe, images }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        resetAdd();
        $("extract-status").textContent = "";
        showToast(`Saved “${data.title}”! 🎉`);
        await loadRecipes();
        $("saved").scrollIntoView({ behavior: "smooth" });
      } catch (err) {
        $("save-status").innerHTML = `<span class="error">${esc(err.message)}</span>`;
      } finally {
        $("save-btn").disabled = false;
      }
    });

    $("cancel-btn").addEventListener("click", () => {
      resetAdd();
      $("extract-status").textContent = "Discarded.";
      $("add").scrollIntoView({ behavior: "smooth" });
    });

    function resetAdd() {
      images = [];
      $("files").value = "";
      $("link").value = "";
      $("pasted").value = "";
      $("thumbs").innerHTML = "";
      $("review").hidden = true;
    }

    // ---- Step 3: list and search ----
    const statusLabel = { want_to_try: "★ Want to try", favorite: "♥ Favorite" };
    const safeLink = (url) => (/^https?:\/\//i.test(url) ? url : "");

    async function loadRecipes() {
      const query = $("search").value.trim();
      const params = new URLSearchParams({ q: query, status: $("status-filter").value });
      const res = await fetch(`/api/recipes?${params}`);
      const recipes = await res.json();
      if (!res.ok) {
        $("results").innerHTML = `<p class="error">${esc(recipes.error)}</p>`;
        return;
      }
      if (!recipes.length) {
        $("results").innerHTML = query
          ? `<p class="empty"><span class="big" aria-hidden="true">🔍</span>Nothing matches “${esc(query)}”. Try an ingredient, or a tag like “dinner”.</p>`
          : `<p class="empty"><span class="big" aria-hidden="true">📖</span>Your scrapbook is empty. Add your first recipe above!</p>`;
        return;
      }
      const count = `<p class="count">${recipes.length} recipe${recipes.length > 1 ? "s" : ""}</p>`;
      $("results").innerHTML = count + recipes.map((r) => {
        const link = safeLink(r.source_url);
        const source = r.source_name || link
          ? `From ${esc(r.source_name)} ${link ? `(<a href="${esc(link)}" target="_blank" rel="noopener">original</a>)` : ""}`
          : "";
        const facts = [r.servings && `Serves ${esc(r.servings)}`, r.total_time && esc(r.total_time)].filter(Boolean).join(" · ");
        return `<details class="recipe">
          <summary>
            <span class="recipe-title">${esc(r.title)}</span><span class="badge ${r.status}">${statusLabel[r.status]}</span>
            <div class="meta">${source}</div>
            <div class="tags">${r.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
          </summary>
          ${facts ? `<div class="meta" style="margin-top:8px">${facts}</div>` : ""}
          <h4>Ingredients</h4>
          ${r.ingredient_groups.map((g) => `${g.name ? `<div class="group-name">${esc(g.name)}</div>` : ""}<ul>${g.items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>`).join("")}
          <h4>Steps</h4>
          <ol>${r.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>
          ${r.notes ? `<h4>Notes</h4><p>${esc(r.notes)}</p>` : ""}
          ${r.images.length ? `<h4>Original screenshots</h4><div class="thumbs">${r.images.map((f) => `<a href="/images/${esc(f)}" target="_blank"><img src="/images/${esc(f)}" alt="Original screenshot" /></a>`).join("")}</div>` : ""}
        </details>`;
      }).join("");
    }

    let searchTimer;
    $("search").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadRecipes, 250); });
    $("status-filter").addEventListener("change", loadRecipes);
    loadRecipes();
  </script>
</body>
</html>
